<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music — lucas makinen</title>
<script>
  // Follow the main site's theme (same localStorage key as the navbar toggle).
  // Runs before paint to avoid a flash.
  (function () {
    let theme = localStorage.getItem("theme");
    if (theme == null || theme == "null") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    --bg: #fcfcfa;
    --ink: #111;
    --ink-soft: #222;
    --muted: #999;
    --faint: #bbb;
    --line: #e4e4e0;
    --veil: rgba(252, 252, 250, 0.25);
  }
  html[data-theme="dark"] {
    --bg: #121211;
    --ink: #ececea;
    --ink-soft: #d8d8d4;
    --muted: #8a8a85;
    --faint: #5c5c57;
    --line: #2a2a27;
    --veil: rgba(18, 18, 17, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 28px 160px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 18px;
    padding: 34px 0 26px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 48px;
  }
  header h1 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: lowercase;
  }
  header .links {
    display: flex;
    align-items: baseline;
    gap: 22px;
  }
  header a, header button {
    color: var(--muted);
    background: none;
    border: none;
    text-decoration: none;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.14em;
    cursor: pointer;
    padding: 0;
  }
  header a:hover, header button:hover { color: var(--ink); }

  .intro {
    max-width: 420px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 56px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 18px; } }

  .card { cursor: pointer; }
  .cover {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--line);
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .card:hover .cover img { transform: scale(1.045); }
  .cover .veil {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    transition: background 0.35s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover .veil span {
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0;
    transition: opacity 0.35s ease;
    background: var(--bg);
    padding: 8px 14px;
  }
  .card:hover .veil { background: var(--veil); }
  .card:hover .veil span { opacity: 1; }

  .meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding-top: 12px;
  }
  .meta .title {
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .meta .num {
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .card.playing .meta .title { font-style: italic; }
  .card.playing .num { color: var(--ink); }

  /* sticky bottom player */
  #bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 14px 28px 16px;
    transform: translateY(110%);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
    z-index: 100;
  }
  #bar.open { transform: translateY(0); }
  #bar .inner {
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  #bar iframe {
    flex: 1;
    height: 80px;
    border: 0;
    border-radius: 10px;
    display: block;
  }
  #bar button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
  }
  #bar button:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>lucas makinen &nbsp;&middot;&nbsp; music</h1>
    <div class="links">
      <button id="themeToggle" aria-label="Toggle dark mode">&#9789;</button>
      <a href="/">back to site &rarr;</a>
    </div>
  </header>

  <p class="intro">
    Selected recordings and features &mdash; trumpet.
    Click any cover to listen.
  </p>

  <div class="grid" id="grid"></div>
</div>

<div id="bar">
  <div class="inner">
    <iframe id="barFrame" src="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    <button id="barClose">close</button>
  </div>
</div>

<script>
(() => {
  const TRACKS = [
    { id: "0Ljpx6qbLqO9ReBNHsZM3k", title: "Waltz (Low Exposure)",               img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02e8aca4bbf481a12cd7c75484" },
    { id: "5wBwWZEpFJ74PObktWZoi1", title: "Si Tu Lo Quieres / Together We Rise", img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02753a0b1479a92a0e745f8869" },
    { id: "4I2gD0xog9JlKCHkmXtqCY", title: "Wake Up!",                            img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e0278af9374dcdfadcf50c98968" },
    { id: "0pTvRdnF0ToWGiFvKbBcmg", title: "Riot Gear",                           img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e0262d1a59efceb1f74642e2664" },
    { id: "3HThDu0joQyDGVd1Fl3oHg", title: "no utensils",                         img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02d7bcf865968d375569b0dd33" },
    { id: "2xywUgMVED2Ait1IzNZVNM", title: "Nov. 16 (Paper Ducks)",               img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e026bae123bb607668a7f8f5409" },
    { id: "67aQefS0bpWqtRULPM3X46", title: "LORD PROTECT ME FROM MY SINS",        img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e02d391367f544d51598ea28f17" },
    { id: "7L31EhqWRpZohUHuGiwLFz", title: "Nuits brumeuse: Between Puddles",     img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e0290c5f5b5d4d242f7ad2779db" },
    { id: "7j3H4TcO4O6Bjg80aNTsYI", title: "Amor N\u00f4made",                    img: "https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e025f56faa0ddd98df65f912d7c" },
  ];

  const grid = document.getElementById("grid");
  const bar = document.getElementById("bar");
  const frame = document.getElementById("barFrame");
  const toggle = document.getElementById("themeToggle");
  let currentTrack = null;

  const theme = () => document.documentElement.getAttribute("data-theme");

  // Spotify embed: theme=0 is the dark player; default follows album art.
  function embedSrc(id) {
    const dark = theme() === "dark" ? "&theme=0" : "";
    return `https://open.spotify.com/embed/track/${id}?utm_source=generator${dark}`;
  }

  TRACKS.forEach((t, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="cover">
        <img src="${t.img}" alt="${t.title}" loading="lazy">
        <div class="veil"><span>listen</span></div>
      </div>
      <div class="meta">
        <span class="title">${t.title}</span>
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
      </div>`;
    card.addEventListener("click", () => {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("playing"));
      card.classList.add("playing");
      currentTrack = t.id;
      frame.src = embedSrc(t.id);
      bar.classList.add("open");
    });
    grid.appendChild(card);
  });

  document.getElementById("barClose").addEventListener("click", () => {
    bar.classList.remove("open");
    frame.src = "";
    currentTrack = null;
    document.querySelectorAll(".card").forEach(c => c.classList.remove("playing"));
  });

  // theme toggle — writes the same key the main site reads
  function applyToggleIcon() {
    toggle.innerHTML = theme() === "dark" ? "&#9788;" : "&#9789;";
  }
  toggle.addEventListener("click", () => {
    const next = theme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    applyToggleIcon();
    if (currentTrack) frame.src = embedSrc(currentTrack);
  });
  applyToggleIcon();
})();
</script>
</body>
</html>
